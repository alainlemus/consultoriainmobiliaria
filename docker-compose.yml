version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    volumes:
      - storage:/var/www/html/storage
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - appnet
      - dokploy

volumes:
  storage:

networks:
  appnet:
  dokploy:
    external: true
